<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counting down to Malvika’s birthday</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2a2e;--bg2:#17393e;--rose:#ff5d9e;--blush:#ffd3e2;--gold:#e8c27a;--ink:#fff4f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 60%);color:var(--ink);font-family:'Fraunces',Georgia,serif;min-height:100vh;overflow-x:hidden;text-align:center}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petals i{position:absolute;top:-30px;width:12px;height:16px;background:var(--rose);border-radius:80% 0 80% 0;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:56px 20px 40px}
.hand{font-family:'Caveat',cursive;color:var(--gold);font-size:26px;margin:0}
h1{font-weight:300;font-style:italic;font-size:clamp(40px,10vw,76px);line-height:1.05;margin:10px 0 6px}
h1 b{font-weight:500;color:var(--blush)}
.sub{opacity:.8;margin:0 auto 34px;max-width:34ch;line-height:1.6}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px;margin:0 auto}
.t{border:1.5px solid var(--gold);border-radius:60px 60px 18px 18px;padding:22px 4px 14px;background:rgba(255,255,255,.04)}
.t span{display:block;font-size:clamp(34px,9vw,56px);font-weight:500;color:var(--blush);font-variant-numeric:tabular-nums;line-height:1}
.t small{display:block;margin-top:8px;font-size:14px;opacity:.75;font-style:italic}
.date{margin:26px 0 0;font-size:18px}
.photos{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:56px 0 24px}
.pol{background:#fff;padding:10px 10px 38px;width:min(300px,78vw);box-shadow:0 14px 34px rgba(0,0,0,.4);position:relative}
.pol img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;object-position:top}
.pol p{position:absolute;left:0;right:0;bottom:6px;margin:0;font-family:'Caveat',cursive;color:#a32a62;font-size:24px}
.pol:nth-child(1){transform:rotate(-3deg)}.pol:nth-child(2){transform:rotate(2.5deg)}
.note{max-width:44ch;margin:40px auto 0;font-size:19px;line-height:1.75;font-weight:300}
.note em{color:var(--blush)}
.heart{display:inline-block;color:var(--rose);font-size:34px;margin-top:22px;cursor:pointer;background:none;border:0;animation:beat 1.6s infinite}
.heart:focus-visible{outline:2px solid var(--gold);border-radius:8px}
@keyframes beat{50%{transform:scale(1.18)}}
#msg{min-height:30px;font-family:'Caveat',cursive;font-size:26px;color:var(--gold);margin-top:8px}
.party h2{font-size:clamp(34px,8vw,56px);font-weight:300;font-style:italic;margin:0 0 8px}
.burst{position:fixed;pointer-events:none;z-index:5;font-size:22px;animation:up 1.4s ease-out forwards}
@keyframes up{to{transform:translate(var(--x),-60vh) scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.petals,.heart{animation:none}.petals i{animation:none}}
</style>
</head>
<body>
<div class="petals" id="petals" aria-hidden="true"></div>
<main>
  <p class="hand">for my favourite person</p>
  <h1>Malvika, <b>your day</b> is coming</h1>
  <p class="sub" id="sub">Every second brings us closer to the 6th of December.</p>

    <div class="t"><span id="m">--</span><small>minutes</small></div>
    <div class="t"><span id="s">--</span><small>seconds</small></div>
  </section>

  <p class="note">You turn a plain day into something <em>golden</em>. I can’t wait to celebrate you, so keep this page open and watch the time melt away.</p>
  <button class="heart" id="heart" aria-label="Send a little love">♥</button>
  <div id="msg"></div>
</main>
<script>
(function(){
  var target=new Date(2026,11,6,0,0,0);
  var el=function(i){return document.getElementById(i)};
  var pad=function(n){return n<10?'0'+n:''+n};
  function tick(){
    var now=new Date(),diff=target-now;
    var end=new Date(2026,11,7,0,0,0);
    if(now>=target&&now<end){party('Happy Birthday, Malvika!','Today is all about you. Make a wish.');return}
    if(now>=end){party('Happy belated birthday, Malvika','I hope it was beautiful.');return}
    var s=Math.floor(diff/1000);
    el('d').textContent=Math.floor(s/86400);
    el('h').textContent=pad(Math.floor(s%86400/3600));
    el('m').textContent=pad(Math.floor(s%3600/60));
    el('s').textContent=pad(s%60);
  }
  var done=false;
  function party(t,sub){
    if(done)return;done=true;clearInterval(iv);
    el('count').outerHTML='<div class="party"><h2>'+t+'</h2></div>';
    el('sub').textContent=sub;
    document.querySelector('h1').innerHTML='🎂 <b>It’s time</b> 🎂';
  }
  tick();var iv=setInterval(tick,1000);
  var p=el('petals');
  for(var i=0;i<16;i++){var e=document.createElement('i');
    e.style.left=Math.random()*100+'%';e.style.animationDuration=(9+Math.random()*10)+'s';
    e.style.animationDelay=(-Math.random()*15)+'s';e.style.opacity=.3+Math.random()*.4;
    e.style.transform='scale('+(.6+Math.random()*.8)+')';p.appendChild(e)}
  var lines=['You are loved, always.','Every reason to smile is you.','Pick a wish for the 6th.','Still thinking of you.','My heart says hi.','Almost there, birthday girl.'];
  var k=0;
  el('heart').addEventListener('click',function(ev){
    el('msg').textContent=lines[k++%lines.length];
    var r=ev.currentTarget.getBoundingClientRect();
    for(var i=0;i<8;i++){var b=document.createElement('span');b.className='burst';
      b.textContent=['💗','🪷','✨','💖'][i%4];b.style.left=(r.left+r.width/2)+'px';b.style.top=(r.top)+'px';
      b.style.setProperty('--x',(Math.random()*200-100)+'px');document.body.appendChild(b);
      setTimeout(function(n){return function(){n.remove()}}(b),1500)}
  });
})();
</script>
